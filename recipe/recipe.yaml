schema_version: 1

context:
  version: "2.0.1"

package:
  name: go-gum
  version: ${{ version }}

source:
  url: https://github.com/charmbracelet/gum/archive/v${{ version }}.tar.gz
  sha256: 2cbc41662ff6c8df30ff3f6c133d4276db72a6f9b3df7eb942f1a798bcbf3d80

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - gum --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Tool for glamorous shell scripts
  homepage: https://github.com/charmbracelet/gum
  repository: https://github.com/charmbracelet/gum

extra:
  recipe-maintainers:
    - danielnachun
