schema_version: 1

context:
  version: "2.0.0"

package:
  name: go-gum
  version: ${{ version }}

source:
  url: https://github.com/charmbracelet/gum/archive/v${{ version }}.tar.gz
  sha256: 8a5baa1e1647cdc3f7fdf91939de5372791ab133117416c8e3d944afbf0b3c9c

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - gum --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Tool for glamorous shell scripts
  homepage: https://github.com/charmbracelet/gum
  repository: https://github.com/charmbracelet/gum

extra:
  recipe-maintainers:
    - danielnachun
